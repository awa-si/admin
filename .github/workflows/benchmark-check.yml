name: Admin benchmark static checks

on:
  push:
    paths:
      - 'benchmarks/**'
      - 'validate.py'
      - 'core.yaml'
      - 'workflow.md'
      - 'workflow/**'
      - '.github/workflows/benchmark-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Benchmark case and baseline checks
        run: python benchmarks/evaluate.py --check
      - name: Scorer regression tests
        run: python -m unittest discover -s benchmarks -p 'test_*.py' -v
      - name: Live model runner readiness
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "model_runner_preflight: BLOCKED (no API credential exposed to this runner)"
          else
            echo "model_runner_preflight: credential available; runner implementation required"
          fi
      - name: Admin validator
        run: |
          python -m pip install --disable-pip-version-check PyYAML
          python validate.py
