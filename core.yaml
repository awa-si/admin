      # ADMIN — AGENT
      
      scope: repository_agent
      repository: awa-si/admin
      branch: main
      mode: normative_machine_directives
      
      fallback_repository_agent:
      - activate_when: target_repository_context_exists_and_target_repository/AGENTS.md_is_missing
