# ChatGPT use-case registry and source resolver; no substantive instruction policy.
version: 3
scope: chatgpt
mode: use_case_resolver

registry:
  - id: behavior
    path: awa-si/admin/behavior.yaml
    load: always
  - id: command
    path: awa-si/admin/command.yaml
    load: always
    role: canonical_user_command_contracts
  - id: workflow
    path: awa-si/admin/workflow.md
    load: on_workflow_or_execution
    role: canonical_route_selection_and_known_case_details
    cases:
      - id: coding
        path: awa-si/admin/workflow/coding.md
        load: on_coding_or_implementation_or_code_quality
        read_when: implementation|code_design|refactor|test|test_design|lint|format|type_check|static_analysis|build_validation|benchmark|performance_review|dependency_selection|coding_documentation|security_review
        modules:
          - id: architecture
            path: awa-si/admin/workflow/coding/architecture.md
            load: on_material_implementation_or_architecture_relevance
            read_when: substantive_implementation|architecture_design|refactor|code_review|public_contract|security_sensitive_change|shared_helper_or_module_design|observability_change|error_or_resource_handling
          - id: documentation
            path: awa-si/admin/workflow/coding/documentation.md
            load: on_coding_documentation_relevance
            read_when: coding_documentation|public_API_docs|contract_documentation|README_change|developer_guidance|documented_examples
          - id: quality
            path: awa-si/admin/workflow/coding/quality.md
            load: on_quality_gate_or_verification_relevance
            read_when: code_change|bugfix|lint|format|type_check|static_analysis|build_validation|test_execution|verification|benchmark|quality_review|documentation_validation
          - id: dependencies
            path: awa-si/admin/workflow/coding/dependencies.md
            load: on_dependencies_relevance
            read_when: dependency_selection|version_sensitive_API|dependency_management|package_manager_change|toolchain_change|build_setup
          - id: concurrency
            path: awa-si/admin/workflow/coding/concurrency.md
            load: on_concurrency_relevance
            read_when: async_API|network_or_database_IO|parallel_processing|shared_mutable_state|backpressure|cancellation
          - id: performance
            path: awa-si/admin/workflow/coding/performance.md
            load: on_performance_relevance
            read_when: performance_sensitive_implementation|profiling|hot_path|benchmark|scaling|memory_or_IO_optimization
          - id: testing
            path: awa-si/admin/workflow/coding/testing.md
            load: on_testing_relevance
            read_when: writing_tests|changing_tests|bugfix|behavior_change|test_review|test_design
          - id: async_testing
            path: awa-si/admin/workflow/coding/async-testing.md
            load: on_async_testing_relevance
            read_when: Python_asyncio_with_pytest|pytest_asyncio_fixture|async_test_failure|async_loop_configuration
      - id: research
        path: awa-si/admin/workflow/research.md
        load: on_search_or_research_or_material_fact_check
        read_when: search|lookup|research|technical_investigation|material_fact_check|source_verification|documentation_search|legal_research
        modules:
          - id: knowledge
            path: awa-si/admin/workflow/research/knowledge.md
            load: on_knowledge_research
            read_when: fact_check|scientific_claim|scientific_consensus|models|evidence_quality|statistical_uncertainty|general_research
          - id: code
            path: awa-si/admin/workflow/research/code.md
            load: on_code_research
            read_when: algorithm_research|library_evaluation|API_comparison|implementation_choice|technical_design_research|engineering_evidence
          - id: docs
            path: awa-si/admin/workflow/research/docs.md
            load: on_docs_research
            read_when: documentation_search|canonical_documentation|specification_verification|repository_docs_audit|version_and_reference_verification
          - id: legal
            path: awa-si/admin/workflow/research/legal.md
            load: on_legal_research
            read_when: legal_research|regulation|statute|case_law|jurisdiction|filing_procedure|legal_deadline
      - id: github
        path: awa-si/admin/workflow/github.md
        load: on_material_GitHub_capability_or_selected_GitHub_route_including_AWA_MCP_GitHub
        read_when: repository_GitHub_access|ChatGPT_GitHub_connector|GitHub_Patch|GitHub_Workspace|AWA_MCP_github_exec|AWA_MCP_Workspace_Git
        requires: workflow
      - id: mcp
        path: awa-si/admin/workflow/mcp.md
        load: on_selected_MCP_route
        requires: workflow
        discovery: mcp_model
        technical_sources: mcp_instructions
        owner: current_live_MCP_schema_and_provider_technical_contracts
      - id: unknown
        path: awa-si/admin/workflow.md
        load: on_unmatched_case_needing_execution_decision
        section: unknown_case_handling
        reuse_loaded_source: true
  - id: project
    path: awa-si/admin/projects/<project>/*
    load: when_verified_project_context_exists
    read: enumerate_all_existing_files_then_read_each_completely
  - id: repository_agent
    path: <resolved_repository>/AGENTS.md
    load: when_repository_context_is_active
    fallback: awa-si/admin/AGENTS.md#fallback_repository_agent

resolution:
  registry_semantics: ordered_parent_case_source_graph_not_instruction_priority
  case_loading: evaluate_each_case_condition_independently;parent_not_implicitly_loaded
  route_authority: awa-si/admin/workflow.md#routing_decision_order
  source_loading: load_only_matching_cases_except_behavior_and_command
  coding_module_loading: evaluate_nested_read_when_independently|load_matching_module_files_only|no_partial_file_read_claim
  research_module_loading: evaluate_nested_read_when_independently|load_matching_complete_topic_module_files_only
  overlap: combine_matching_use_cases_without_duplicate_reads
  unknown_case: workflow.md#unknown_case_handling;never_bypass_authorization_or_live_provider_admission
  security: higher_priority_ChatGPT_instructions_and_existing_approvals_remain_authoritative
