# Canonical user-command contracts. Always loaded via core.yaml.
scope: global_commands
mode: normative_machine_directives
owner: awa-si/admin/command.yaml
inherits: awa-si/admin/behavior.yaml
parent_rules_remain_active: true

admin_plane_reload:
  command: "reload admin"
  aliases: "reload admin plane|reload admin control plane"
  preferred_bootstrap: "read_awa-si/admin/core.yaml_via_connected_GitHub_connector"
  returned_documents: "resolve_current_admin_files_from_core_index|verify_completeness|use_mcp_model_only_for_selected_MCP_capability_discovery"
  optional_project_delta: "resolve_active_ChatGPT_project_then_load_if_accessible"
  repository_agent: "load_only_when_resolved_repository_context_is_active"
  fallback: "use_connected_repository_or_project_files_if_Admin_bootstrap_is_unavailable_or_incomplete"
  cache_invalidation: "replace_previous_admin_snapshot_after_verified_read"
  runtime_reload_boundary: "mcp_reload_is_a_separate_explicit_MCP_runtime_action_not_part_of_admin_plane_reload"
  do_not_claim: "MCP_process_restarted|tool_schema_changed_without_actual_evidence"

chat_handoff:
  command: "chat_handoff"
  syntax: "chat_handoff [CHAT_NAME]"
  read_when: explicit_chat_handoff_command
  purpose: "produce_structured_reusable_context_for_continuation_in_a_new_chat_within_the_same_verified_ChatGPT_Project"
  project_boundary:
    required: "current_project_must_be_explicitly_exposed_or_verified|never_guess_hidden_UI_project"
    search_scope: "current_verified_project_only|never_include_other_project_or_nonproject_chats"
    unavailable: "report_project_scope_blocker|do_not_claim_project_scoped_search"
  source_chat:
    with_name: "identify_matching_chat_by_exact_or_closest_verified_title_within_current_project|disambiguate_only_if_multiple_material_matches"
    without_name: "use_current_chat_as_source|if_request_explicitly_refers_to_prior_chat_resolve_that_chat_from_project_context"
    resolution: "use_accessible_current_conversation_and_available_prior_chat_context_or_authorized_history_search|do_not_infer_transcript_completeness_from_Memory"
    if_unavailable: "report_missing_source_and_limitations|do_not_invent_messages_or_decisions"
  context_read:
    scope: "read_all_accessible_relevant_context_from_selected_chat|prefer_original_messages_and_verifiable_source_refs_over_summaries"
    extract: "objective|scope|requirements|decisions|completed_work|pending_work|blockers|next_step|files|repositories|branches|commits|workspace_ids|slots|job_refs|session_checkpoint_refs"
    limitations: "ChatGPT_context_window_and_chat_history_access_may_be_partial|never_claim_full_transcript_without_verification"
    truth: "chat_history_is_historical_evidence_not_current_GitHub_head_or_workspace_runtime_state"
  mcp_workspace_continuation:
    policy: "prepare_reuse_hints_only|do_not_create_or_adopt_workspace_or_run_jobs_just_to_create_handoff"
    live_discovery: "only_when_material_and_selected_permitted_MCP_route|read_workflow/mcp.md_and_current_session_and_workspace_contracts"
    handoff_token: "use_existing_token_only_if_explicitly_available_and_authorized|do_not_generate_token_without_explicit_request|never_put_bearer_token_in_public_repo_or_shared_artifact"
    new_chat: "verify_current_repository_and_provider_runtime|resolve_current_chat_binding_then_existing_workspace|follow_explicit_cross_chat_reuse_consent_and_provider_admission|inspect_slot_branch_dirty_paths_and_job_status_before_mutations"
    checkpoint_fallback: "session_exec_handoff_only_if_token_available_and_provider_permitted|restored_checkpoint_is_context_not_authorization"
  output:
    mode: "structured_handoff_text_ready_to_paste_as_first_message_of_new_chat"
    sections: "PROJECT_AND_SOURCE_CHAT|CONTINUATION_OBJECTIVE|DECISIONS_AND_CONSTRAINTS|COMPLETED_WITH_EVIDENCE|OPEN_WORK_AND_NEXT_ACTION|REPOSITORY_AND_WORKSPACE_REFERENCES|LIVE_REVALIDATION_REQUIRED|CONTEXT_GAPS"
    evidence: "distinguish_user_claim|prior_chat_summary|inspected_source|verified_current_state"
    ambiguity: "mark_unknown|unread|historical|unverified_explicitly"
    compact: "preserve_actionable_detail_without_repeating_entire_transcript"
    confidentiality: "omit_credentials|private_tokens|sensitive_data_not_needed_for_continuation"
  side_effects: "read_only|no_repository_mutation|no_workspace_creation|no_job_execution|no_automatic_session_checkpoint"
  completion: "deliver_structured_handoff_in_current_chat|do_not_claim_new_chat_received_or_resumed_work"

mcp_instruction_reload:
  trigger_phrase: "reload mcp"
  semantics: "explicitly_requested_MCP_runtime_reload_then_reread_canonical_instructions"
  execution_mode: "controlled_reload"
  operation_and_scope: "resolve_from_current_live_MCP_reload_schema_and_canonical_contract"
  side_effects_other_than_explicit_reload: "prohibited"
  prohibited_during_reload: "workspace_mutation|repository_write|branch_mutation|new_background_job|unrelated_external_action"
  "no_implicit_authorization_for_other_MCP_operations": true
  reload_is_not_proof_of_process_restart_or_live_code_activation: true
  "apply_newly_verified_contract_to_subsequent_MCP_work_in_this_chat": true

mcp_auto_update:
  command: "update mcp"
  aliases: "update mcp|auto update"
  read_when: explicit_mcp_auto_update_command
  target: "awa-si/awa@main"
  scope: "host_checkout_/opt/awa|session_checkpoint_before_restart|supervisor_service_awa:mcp"
  canonical_owner: "awa-si/awa@main:mcp/host/README.md#gpt-operated-awa-self-update-sequence"
  implementation: "awa-si/awa@main:mcp/host/self_update.py"
  command_authorization:
    exact_current_user_command: "update mcp|auto update"
    authorizes_once: "fixed_host_fast_forward_pull_awa-si/awa@main|conditional_awa:mcp_restart_when_loaded_commit_stale"
    additional_confirmation: "not_required|do_not_render_Confirm_Execute_UI_or_ask_again"
    boundaries: "no_standing_permission|no_unattended_execution|no_other_repository_or_service|provider_admission_still_authoritative"
    other_host_mutations: "require_separate_explicit_user_authorization"
  executor:
    primary: "mcp_diagnostic(operation='update')"
    entrypoint_owner: "awa-si/awa@main:mcp/tools/runtime_tools.py"
    implementation_owner: "awa-si/awa@main:mcp/host/self_update.py"
    call_once_per_explicit_current_command: true
    authorization: "current_exact_update_mcp_or_auto_update_command_covers_fixed_pull_and_conditional_restart_once|provider_admission_required"
    no_duplicate_execution: "do_not_add_separate_host_exec_git.pull_or_supervisor.control_calls_after_diagnostic_update"
    live_schema: "resolve_current_mcp_model_schema_for_mcp_diagnostic_before_call"
  preflight:
    - "verify_connected_GitHub_awa-si/awa@main_remote_HEAD_and_current_AWA_host_contract"
    - "read_mcp_version_before_mutation_and_record_process_identity_and_loaded_commit"
    - "use_live_read_only_host_exec_git.inspect_awa_to_verify_clean_trusted_/opt/awa_main_origin/main_checkout"
    - "verify_current_exact_update_mcp_or_auto_update_command_authorizes_both_fixed_effects"
    - "confirm_openai/session_correlation_available_for_checkpoint_before_mutation"
    - "recheck_live_provider_admission_before_invoking_primary_executor"
  execution:
    - "invoke_primary_mcp_diagnostic_update_once_only"
    - "inspect_returned_host_commit|host_updated|loaded_process_commit|session_checkpoint|status|restart_requested|activation_pending"
    - "when_restart_needed_require_saved_session_checkpoint_and_preserve_its_handoff_token_as_private_bearer_credential"
    - "checkpoint_failure_after_pull_blocks_restart_and_requires_host_state_reconciliation"
    - "require_update_receipt_consistent_with_live_verified_remote_revision"
    - "do_not_treat_restart_queued|restart_already_pending|restart_inflight_as_runtime_verified"
  internal_sequence_reference:
    owner: "awa-si/awa@main:mcp/host/self_update.py"
    sequence: "host_exec_git.inspect_awa -> host_exec_git.pull_awa -> host_exec_git.inspect_awa -> session.checkpoint_if_stale -> host_exec_supervisor.control_awa:mcp_restart_if_stale"
    semantics: "implementation_only;never_repeat_individual_mutations_after_primary_executor"
  activation:
    restart_decision: "owned_by_primary_executor_based_on_loaded_commit_vs_verified_host_commit"
    handoff: "worker_owned_asynchronous_MCP_restart"
    session_checkpoint: "bounded_v2_state_plus_opt_in_gateway_trace;token_private;no_automatic_chat_transcript_or_job_replay"
    queued_or_inflight: "not_proof_of_completed_restart"
    uncertain_or_failed: "fail_closed_and_reconcile_independent_status_before_retry"
  verification:
    initial_post_restart_delay_seconds: 5
    delay_after: "restart_request_accepted_before_first_post_restart_mcp_version_retrieval"
    delay_scope: "only_when_MCP_restart_requested;not_required_if_no_restart"
    checks:
      - "mcp_version_after_reconnect_must_confirm_new_process_identity_and_loaded_commit"
      - "inspect_service_health_and_report_evidence_separately"
      - "distinguish_host_pulled|restart_requested|restart_completed|runtime_verified"
  unchanged: "no_unnecessary_restart_when_loaded_commit_matches_host_HEAD"
  prohibited: "arbitrary_shell|force_pull|host_permission_bypass|dependency_install|deployment|other_service_restart|other_repo_update"
