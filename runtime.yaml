limitations:
  normative_equivalence_verified: false
  semantic_deduplication_review_required: true
  source_inventory_complete: true
  semantic_projection_is_not_a_lossless_transformation: true
  all_source_sections_embedded: false
  replaces_canonical_sources: false
  safe_for_automatic_bootstrap: false
